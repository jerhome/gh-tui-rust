name: Release

# Tag v*: build, archive, checksum and publish the GitHub release.
# workflow_dispatch: same build, artifacts only; a release is created only when run on a v* tag with publish=true.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (only honoured when the run is on a v* tag)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ghu
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ghu.exe
            ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ghu
            ext: tar.gz
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          rustc --version
          cargo --version
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: release-${{ matrix.target }}
      # ghu only: gh-fake and ghu-fake-editor are test tools and are never built here.
      - name: Build
        run: cargo build --release --locked -p ghu --bin ghu --target ${{ matrix.target }}
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
          EXT: ${{ matrix.ext }}
        run: |
          name="ghu-$VERSION-$TARGET"
          mkdir -p "stage/$name" dist
          cp "target/$TARGET/release/$EXE" "stage/$name/"
          cp README.md LICENSE* "stage/$name/" 2>/dev/null || true
          if [ "$EXT" = "zip" ]; then
            (cd stage && 7z a -tzip "../dist/$name.zip" "$name" > /dev/null)
          else
            tar -C stage -czf "dist/$name.tar.gz" "$name"
          fi
          if [ "$EXT" = "zip" ]; then 7z l "dist/$name.zip" > content.txt; else tar -tzf "dist/$name.tar.gz" > content.txt; fi
          echo "== content of dist/$name.$EXT"
          cat content.txt
          if grep -E 'gh-fake|ghu-fake-editor' content.txt; then
            echo "::error::test tool found in the archive"
            exit 1
          fi
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ghu-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: ghu-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum -- * | tee SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [build, checksums]
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          # Pre-release for tags with a suffix (v0.1.0-rc.1).
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
