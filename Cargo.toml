[workspace]
resolver = "3"
members = ["crates/gh-client", "crates/gh-fake", "crates/ghu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jerhome/gh-tui-rust"

# Versions checked with `cargo search` on 2026-11-26 (ADR 0001).
[workspace.dependencies]
gh-client = { path = "crates/gh-client" }
gh-fake = { path = "crates/gh-fake" }

anyhow = "1.0.105"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive"] }
ratatui = "0.30.2"
# No default TLS (it would pull aws-lc-rs, which needs a C toolchain per target): rustls with the ring
# provider and the OS trust store, as in emu-rust (ADR 0001).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# Limited WSL disk: reduced debug info (CONVENTIONS.md § 2).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

# Distributed binary: small, network-bound TUI.
[profile.release]
strip = true
lto = true
codegen-units = 1
