[package]
name = "gh-fake"
description = "Fake GitHub REST server (loopback only) for ghu tests and demos"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Depends on no other crate of the workspace on purpose: its JSON is written from GitHub's documentation,
# independently of gh-client's decoding, so a divergence shows up in tests (ADR 0001).
[dependencies]
axum = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }

[dev-dependencies]
reqwest = { workspace = true }
# reqwest is built with rustls-no-provider: tests install the ring provider themselves.
rustls = { workspace = true }

[[bin]]
name = "gh-fake"
path = "src/main.rs"

[lints]
workspace = true
