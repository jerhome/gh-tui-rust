[package]
name = "ghu"
description = "Terminal client for GitHub: browse repos and pull requests, and review them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
clap = { workspace = true }
dirs = { workspace = true }
gh-client = { workspace = true }
ratatui = { workspace = true }
# Temporary file of the external editor (ADR 0003 § 5).
tempfile = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
gh-fake = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[[bin]]
name = "ghu"
path = "src/main.rs"

# Test double of the user's editor (ADR 0003 § 5): found by tests through CARGO_BIN_EXE_ghu-fake-editor. Never shipped.
[[bin]]
name = "ghu-fake-editor"
path = "src/bin/fake_editor.rs"
test = false
doc = false

[lints]
workspace = true
